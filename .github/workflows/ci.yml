name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-gi gir1.2-gtk-3.0 python3-gi-cairo \
            xvfb libnotify-bin

      - name: Create virtual environment
        run: python3 -m venv --system-site-packages .venv

      - name: Install Talkeys with dev dependencies
        run: .venv/bin/pip install -e ".[dev]"

      - name: Lint with ruff
        run: .venv/bin/python -m ruff check src/ tests/

      - name: Type-check with mypy
        run: .venv/bin/python -m mypy src/talkeys tests/

      # pytest's addopts (pyproject.toml) run coverage and fail the build
      # under 98% — a PR that drops coverage fails here, not just locally.
      - name: Run tests with coverage
        run: xvfb-run --auto-servernum .venv/bin/python -m pytest

  # Only after the tests pass, and only for pushes to main — a broken
  # commit must not get a version tag.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only one release run at a time — a second push landing mid-release must
    # wait, not race the same version bump.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Parses Conventional Commits messages since the last release (feat:,
      # fix:, docs:, ...) to decide whether to bump the version in
      # pyproject.toml, tag it, and publish a GitHub release.
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
